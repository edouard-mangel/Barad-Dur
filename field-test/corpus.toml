# Field-test corpus. Paths are relative to $BARAD_DUR_CORPUS_ROOT
# (default: $HOME/WS). Pins are mandatory: unpinned repos drift and
# every diff becomes noise.

[[repo]]
name = "barad-dur"
path = "barad-dur"
# An ancestor of `main`, so it stays reachable after this branch is
# squash-merged and deleted. A commit that exists only on a feature branch
# becomes unreachable once the branch is gone and the reflog expires, and
# `git worktree add --detach <pin>` then fails as a hard harness error.
pin  = "dc23fbd6"
lang = "Rust"

