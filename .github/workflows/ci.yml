name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: barad-dur-bin
          path: target/release/barad-dur
          retention-days: 1

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  report:
    name: Repository Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [fmt, clippy, test, audit]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: barad-dur-bin
          path: target/release/
      - name: Make binary executable
        run: chmod +x target/release/barad-dur
      - name: Restore analysis cache
        uses: actions/cache@v4
        with:
          path: |
            .repository-analysis/blame_cache.bin
            .repository-analysis/history.json
          key: barad-dur-analysis
          restore-keys: |
            barad-dur-analysis
      - name: Analyze repository
        run: |
          ./target/release/barad-dur analyze . -v
          ./target/release/barad-dur analyze . --html -o barad-dur-report.html
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: barad-dur-report
          path: barad-dur-report.html
          retention-days: 30
