name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

  report:
    name: Repository Report
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build barad-dur
        run: cargo build --release

      - name: Restore analysis cache
        uses: actions/cache@v4
        with:
          path: |
            .repository-analysis/blame_cache.bin
            .repository-analysis/history.json
          key: barad-dur-analysis
          restore-keys: |
            barad-dur-analysis

      - name: Analyze repository
        run: |
          ./target/release/barad-dur analyze . -v
          ./target/release/barad-dur analyze . --html -o barad-dur-report.html

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: barad-dur-report
          path: barad-dur-report.html
          retention-days: 30
