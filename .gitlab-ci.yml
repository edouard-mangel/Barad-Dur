workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "trigger"

stages:
  - lint
  - build
  - test
  - analysis
  - secret-detection
  - deploy
  - release
  - docker
  - mirror
  - api

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  SECRET_DETECTION_ENABLED: 'true'
  GIT_DEPTH: "0"
  # Nights in one full pass of the nightly mutation sweep. Tonight's slice is
  # (day-of-year - 1) % NIGHTLY_SLICES, cut `parallel:` ways. Raise it if
  # shards start timing out, lower it to finish a pass sooner; see the sizing
  # note on `mutation-nightly` for the measurements behind 24.
  NIGHTLY_SLICES: "24"

# Froggit's shared runners intermittently fail with Docker bridge networking
# errors ("bridge port not forwarding") — retry infrastructure-level failures
# automatically instead of failing the pipeline on them.
default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stale_schedule

# Code cache — only registry index + git checkouts. The target/ dir is too large
# (30k+ files) and stalls Froggit's shared runners on upload. Instead, each job
# recompiles from source (~2 min) which is faster than downloading a stale cache.
.rust-cache: &rust-cache
  cache:
    key: rust-registry
    policy: pull
    paths:
      - .cargo/registry/cache
      - .cargo/registry/index
      - .cargo/git/db

# Shared base for Rust jobs that don't use CI tools
.rust-base: &rust-base
  image: rust:1.98.1
  <<: *rust-cache
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake pkg-config libssl-dev

# Resolve the MR's mutable merge ref once in build and persist its exact SHA.
# Every tree-dependent consumer receives that artifact, verifies the ref has
# not moved, and checks out the same commit. A target-branch update therefore
# restarts/fails the pipeline instead of mixing binaries and test sources.
.resolve-merge-result: &resolve-merge-result
  - |
    if [ -n "$CI_MERGE_REQUEST_IID" ]; then
      git fetch -q origin "refs/merge-requests/$CI_MERGE_REQUEST_IID/merge"
      git rev-parse FETCH_HEAD > .merge-result-sha
    else
      git rev-parse HEAD > .merge-result-sha
    fi
    git checkout -q "$(cat .merge-result-sha)"

.checkout-merge-result: &checkout-merge-result
  - |
    expected_merge_sha="$(cat .merge-result-sha)"
    if [ -n "$CI_MERGE_REQUEST_IID" ]; then
      git fetch -q origin "refs/merge-requests/$CI_MERGE_REQUEST_IID/merge"
      fetched_merge_sha="$(git rev-parse FETCH_HEAD)"
      test "$fetched_merge_sha" = "$expected_merge_sha"
    fi
    git checkout -q "$expected_merge_sha"

# Same as .rust-base, on the merge result.
.rust-base-merged: &rust-base-merged
  image: rust:1.98.1
  <<: *rust-cache
  before_script:
    - *checkout-merge-result
    - apt-get update -qq && apt-get install -y -qq cmake pkg-config libssl-dev

# Shared base for Rust jobs that use CI tools (nextest, tarpaulin, etc.)
# cargo-binstall downloads pre-built binaries in seconds — no source compilation,
# no shared tool cache to manage. Each job installs only what it needs.
.rust-tools-base: &rust-tools-base
  image: rust:1.98.1
  <<: *rust-cache
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake pkg-config libssl-dev
    - curl -L --proto '=https' --tlsv1.2 -sSf
        "https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-musl.tgz"
        | tar -xz -C /usr/local/bin

# Same as .rust-tools-base, on the merge result.
.rust-tools-base-merged: &rust-tools-base-merged
  image: rust:1.98.1
  <<: *rust-cache
  before_script:
    - *checkout-merge-result
    - apt-get update -qq && apt-get install -y -qq cmake pkg-config libssl-dev
    - curl -L --proto '=https' --tlsv1.2 -sSf
        "https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-musl.tgz"
        | tar -xz -C /usr/local/bin

# ── Lint ──────────────────────────────────────

fmt-check:
  stage: lint
  image: rust:1.98.1
  cache: []
  before_script: []
  script:
    - rustup component add rustfmt
    - cargo fmt -- --check

# The mutation gate decides whether merge requests pass, so its edge cases —
# skipped shards, shards that died without a summary, diffs with no Rust in
# them — are pinned by tests rather than discovered in a red pipeline.
mutation-gate-selftest:
  stage: lint
  image: python:3.12-slim
  cache: []
  before_script: []
  script:
    - cd scripts && python3 -m unittest discover -p 'test_*.py' -v
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The campaign script is the evidence an over-capacity merge request stands on,
# so its harness has to run somewhere other than a reviewer's memory. It needs
# git (it builds a throwaway repository) and supplies its own fake cargo on
# PATH, which is why it runs on the Rust image rather than the gate's slim one.
campaign-script-selftest:
  stage: lint
  image: rust:1.98.1
  cache: []
  before_script: []
  script:
    - sh scripts/mutation-campaign.test.sh
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH


# ── Build ─────────────────────────────────────

build-presentation:
  stage: build
  image: node:22-slim
  before_script:
    - corepack enable && corepack prepare pnpm@10.33.2 --activate
  script:
    - cd docs/presentation/slidev
    - pnpm install --frozen-lockfile
    - pnpm build
  artifacts:
    paths:
      - docs/presentation/slidev/dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Clippy and release build share one runner: clippy (debug) runs first,
# then the release build reuses the already-compiled dependency artifacts.
build:
  stage: build
  image: rust:1.98.1
  <<: *rust-cache
  before_script:
    - *resolve-merge-result
    - apt-get update -qq && apt-get install -y -qq cmake pkg-config libssl-dev
  cache:
    key: rust-registry
    policy: pull-push
    paths:
      - .cargo/registry/cache
      - .cargo/registry/index
      - .cargo/git/db
  script:
    - rustup component add clippy
    - cargo clippy --all-targets -- -D warnings
    # The field-test driver binary has `required-features = ["field-test"]`, so
    # the line above never compiles it. Without this second pass a refactor of
    # any `field_test::*` signature breaks the driver while CI stays green.
    - cargo clippy --all-targets --features field-test -- -D warnings
    - cargo clippy --all-targets --features export-types -- -D warnings
    - cargo run --features export-types --example export_report_types -- --check
    - cargo test --features export-types --examples
    - cargo test --features export-types scorer::report_contract_tests::current_fixture_matches_actual_rust_serialization --lib
    # `--features field-test` also builds the harness driver that the
    # field-test job runs, so that job needs no second compile.
    - cargo build --release --features field-test
  artifacts:
    paths:
      - target/release/barad-dur
      - target/release/field-test
      - .merge-result-sha
    expire_in: 1 week

# ── Test ──────────────────────────────────────

test:
  stage: test
  <<: *rust-tools-base-merged
  needs:
    - build
  timeout: 3 hours
  script:
    - cargo binstall --no-confirm --locked cargo-nextest
    - cargo nextest run --workspace --profile ci
  artifacts:
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 1 week

dashboard-contract:
  stage: test
  image: node:22
  needs:
    - build
  before_script:
    - *checkout-merge-result
    - corepack enable && corepack prepare pnpm@10.33.2 --activate
  script:
    - pnpm -C dashboard install --frozen-lockfile
    - pnpm -C dashboard check

coverage:
  stage: test
  <<: *rust-tools-base-merged
  needs:
    - build
  timeout: 3 hours
  script:
    - cargo binstall --no-confirm cargo-tarpaulin
    - rustup component add llvm-tools-preview
    - cargo tarpaulin --engine llvm --out xml --output-dir coverage/ --fail-under 80
  coverage: '/^\d+.\d+% coverage/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

sast:
  stage: test

# ── Analysis ──────────────────────────────────

audit:
  stage: analysis
  <<: *rust-tools-base
  script:
    - cargo binstall --no-confirm cargo-audit
    - cargo audit
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      allow_failure: false
    - when: always
      allow_failure: true

deny:
  stage: analysis
  <<: *rust-tools-base
  script:
    - cargo binstall --no-confirm cargo-deny
    - cargo deny check
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      allow_failure: false
    - when: always
      allow_failure: true

semver-check:
  stage: analysis
  <<: *rust-tools-base
  script:
    - cargo binstall --no-confirm cargo-semver-checks
    - |
      # Diff against the previous git tag (works even before crates.io has the new version).
      # On tag pipelines, exclude the current tag to get the prior release.
      BASELINE=$(git tag --sort=-version:refname \
        | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
        | grep -v "^${CI_COMMIT_TAG}$" \
        | head -n 1)
      if [ -z "$BASELINE" ]; then
        echo "No previous tag found — skipping semver check"
        exit 0
      fi
      echo "Checking semver compatibility against $BASELINE"
      cargo semver-checks check-release --baseline-rev "$BASELINE"
  allow_failure: true
  rules:
    - when: always

# Mutation testing — per-feature: scoped to the MR diff or last commit on main.
# Split into parallel shards + an aggregating gate. Blocking (allow_failure:
# false on the gate). Each shard runs 1/CI_NODE_TOTAL of the mutant list
# concurrently; nextest speeds up each test invocation.
mutation:
  stage: analysis
  <<: *rust-tools-base
  # 6, raised from 3: cargo-mutants splits the mutant list evenly by COUNT,
  # never by cost, so one slice can carry most of the expensive mutants. On
  # !135 the three shards ran 2.2h, 4.0h and 3.1h, and the 4.0h one was killed
  # at 14,408s against the ceiling below with zero surviving mutants; two
  # shards of the Pressman-coupling MR had already timed out the same way.
  # Halving the slice buys margin on the outlier. Raising the ceiling instead
  # would only make a stuck shard fail later, and 6h is the runner's own limit.
  #
  # More shards is not free and 6 is not a floor to keep raising: every shard
  # repeats the unmutated baseline, ~30min here because the integration suites
  # dogfood the real repo, so total runner time grows with the count while
  # throughput does not. That is the same trade-off the nightly weighed before
  # settling at 24 for a full-codebase sweep.
  parallel: 6
  # 4h: a large MR diff can carry ~50 mutants, and the unmutated baseline alone
  # costs ~30min (integration suites dogfood the real repo).
  timeout: 4 hours
  script:
    - |
      # How many shards the gate must hear from. Written by every child, so
      # `parallel:` above stays the only place the count is stated.
      echo "MUTATION_SHARDS=${CI_NODE_TOTAL}" > shards.env
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        git diff "$CI_MERGE_REQUEST_DIFF_BASE_SHA"..HEAD > recent.diff
      else
        git diff HEAD~1..HEAD > recent.diff
      fi
      if [ ! -s recent.diff ]; then
        echo "skipping mutation run" > mutants-${CI_NODE_INDEX}.log
        exit 0
      fi
      cargo binstall --no-confirm --locked cargo-mutants cargo-nextest
      # Capacity, in mutants the six shards can actually test: each repeats the
      # ~30min unmutated baseline inside its own 4h wall, and measured
      # throughput on !145/!146/!149 was 4-11 mutants per shard in 25min-2h.
      # That is 19 mutants per shard at the slow end of what was measured, so
      # 100 for six, not the 150 this started at: a 120-mutant diff sat under
      # the old bound and still lost all six shards to the wall, which is the
      # failure this branch exists to remove, not a case to leave inside it.
      # Pipelines 130487, 130553, 130615 and 130953 each lost all six that way.
      # Say so once instead, and let the gate ask the author for the local
      # campaign's evidence (scripts/mutation-campaign.sh).
      CAPACITY=${MUTATION_CAPACITY:-100}
      MUTANTS=$(cargo mutants --list --in-diff recent.diff | wc -l)
      if [ "$MUTANTS" -gt "$CAPACITY" ]; then
        # tee, not a plain redirect: the gate reads the artifact, and whoever
        # opens the job needs to see why it did nothing.
        echo "MUTATION OVER CAPACITY: ${MUTANTS} in-diff mutants exceed the per-MR capacity of ${CAPACITY}" \
          | tee mutants-${CI_NODE_INDEX}.log
        exit 0
      fi
      # cargo-mutants shards are 0-based; CI_NODE_INDEX is 1-based. An
      # off-by-one here silently drops a slice of the codebase instead of
      # erroring, so it is computed once, here, and nowhere else.
      SHARD=$((CI_NODE_INDEX - 1))
      # --in-diff: only mutate code touched by the feature diff (per-feature strategy).
      # --timeout-multiplier instead of a fixed cap: the suite's clean runtime grows
      # with the codebase and already outran a hardcoded 300s once (baseline timeout).
      # --shard denominator is CI_NODE_TOTAL, so changing `parallel:` above is
      # the only edit a reshard needs.
      # || true: shard exit codes (missed/timeout mutants) must not fail the job —
      # the mutation-gate aggregates all shards and is the single blocking decision.
      NEXTEST_PROFILE=mutation BARAD_DUR_TEST_REPO=${CI_PROJECT_DIR} cargo mutants \
        --in-diff recent.diff \
        --shard ${SHARD}/${CI_NODE_TOTAL} \
        --test-tool nextest \
        --timeout-multiplier 3 --jobs 2 \
        --output mutants-out-${CI_NODE_INDEX} \
        2>&1 | tee mutants-${CI_NODE_INDEX}.log || true
  artifacts:
    paths:
      - mutants-${CI_NODE_INDEX}.log
      - mutants-out-${CI_NODE_INDEX}/
    reports:
      dotenv: shards.env
    when: always
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
  allow_failure: false

# Gate: aggregates all shard logs and enforces the ≥80% kill rate.
mutation-gate:
  stage: analysis
  image: python:3.12-slim
  # One entry covers every parallel instance: GitLab downloads all of the
  # matrix children's artifacts, which is what the 'mutants-*.log' glob needs.
  needs:
    - job: mutation
      artifacts: true
  script:
    - |
      # --require-override only on a merge request: it is the description that
      # carries the override section, and main has none. An over-capacity run
      # on main falls back to the nightly sweep.
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        # GitLab keeps only the first 2700 characters of the description in
        # CI_MERGE_REQUEST_DESCRIPTION and reports the cut separately, so the
        # gate can tell a missing override section from an invisible one.
        MUTATION_OVERRIDE_TEXT="$CI_MERGE_REQUEST_DESCRIPTION" \
        MUTATION_OVERRIDE_TRUNCATED="$CI_MERGE_REQUEST_DESCRIPTION_IS_TRUNCATED" \
          python3 scripts/mutation_gate.py --require-override \
            --shards "${MUTATION_SHARDS:-0}" 'mutants-*.log'
      else
        python3 scripts/mutation_gate.py --shards "${MUTATION_SHARDS:-0}" 'mutants-*.log'
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
  allow_failure: false

# Mutation testing — nightly: full codebase, no diff filter.
# To enable: Settings > CI/CD > Schedules — add a daily trigger on main.
# Set allow_failure: false once a full-codebase kill rate is confirmed.
#
# Sharded because a full sweep does not fit one runner: cargo-mutants rebuilds
# per mutant (~200s each in CI), so 3400 mutants cost ~47h of build time alone
# before a single test runs. The unsharded job never finished — it was killed
# at its 6h limit having covered under 6% of the corpus.

# Remembers the commit the last completed sweep ran against. Separate from the
# registry cache because this one has to be writable.
.mutation-state-cache: &mutation-state-cache
  cache:
    key: mutation-nightly-state
    policy: pull-push
    paths:
      - .mutation-nightly/

# Guard: a sweep costs ~16 runners for hours, so skip it when main has not
# moved. Fail-safe by construction — a cache miss reads as "none", which runs
# the sweep. The failure mode is a wasted night, never a missed regression.
mutation-nightly-guard:
  stage: test
  image: alpine:3
  cache:
    key: mutation-nightly-state
    policy: pull
    paths:
      - .mutation-nightly/
  script:
    - |
      # Tonight's slice of the mutant list. Rotating by day-of-year means a
      # full pass takes NIGHTLY_SLICES nights and every night finishes.
      # `date +%j` is zero-padded and $(( )) reads a leading zero as octal,
      # so day 008 aborts with "Illegal number". Strip the padding with sed
      # rather than bash's 10# prefix: this job runs on alpine:3, whose
      # busybox sh rejects 10# outright.
      DOY=$(date -u +%j | sed 's/^0*//')
      SLICE=$(( (DOY - 1) % NIGHTLY_SLICES ))
      LAST=$(cat .mutation-nightly/last-sha 2>/dev/null || echo "none")
      LAST_SLICE=$(cat .mutation-nightly/last-slice 2>/dev/null || echo "none")
      if [ "$LAST" = "$CI_COMMIT_SHA" ] && [ "$LAST_SLICE" = "$SLICE" ]; then
        # Same tree AND same slice: this exact work already completed. Any
        # other combination adds coverage — a new slice reaches mutants the
        # last night never got to, even when main has not moved, which is why
        # the SHA alone is no longer the skip condition.
        echo "slice $SLICE of $CI_COMMIT_SHA already swept — skipping"
        echo "RUN_MUTATION=false" > guard.env
      else
        echo "sweeping slice $SLICE of $NIGHTLY_SLICES (last: slice $LAST_SLICE of $LAST)"
        echo "RUN_MUTATION=true" > guard.env
      fi
      echo "NIGHTLY_SLICE=$SLICE" >> guard.env
      echo "LAST_NIGHTLY_SHA=$LAST" >> guard.env
  artifacts:
    reports:
      dotenv: guard.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

mutation-nightly:
  stage: analysis
  <<: *rust-tools-base
  timeout: 6 hours
  # Resized from the first sharded run (pipeline 129672), which measured what
  # the original estimate had guessed at, and got it wrong by 8.5x:
  #
  #   mutants in the codebase   3672   (153 per shard across 24)
  #   unmutated baseline          43min average, paid once per shard
  #   cost of one mutant        1706s build + up to 3978s test
  #   completed in 6h           0, 0, 1, 1, 7, 19 per shard — median 1
  #   shards that finished      0 of 24
  #
  # Sharding alone cannot fix that: it divides the mutants but multiplies the
  # baseline. At the best observed rate, covering 3672 mutants would need ~194
  # shards and 139 runner-hours of baseline before a single mutant runs.
  #
  # So the scope is bounded instead. Each night sweeps 1/NIGHTLY_SLICES of the
  # mutant list, cut CI_NODE_TOTAL ways, and a full pass completes over
  # NIGHTLY_SLICES nights. Budget per shard: 360min wall - 43min baseline =
  # 317min for mutants, and at ~45min each that is 7. 3672/(24*24) = 6.4 fits
  # with margin.
  #
  # Per-mutant cost varies widely (16min to 95min observed), so some shards
  # will still time out. That is now cheap: a lost shard costs ~6 mutants
  # rather than the 153 it used to, and allow_failure keeps the gate reporting
  # on whatever completed.
  parallel: 24
  needs:
    - job: mutation-nightly-guard
      artifacts: true
  script:
    - |
      if [ "$RUN_MUTATION" != "true" ]; then
        echo "skipping mutation run (main unchanged since $LAST_NIGHTLY_SHA)" \
          > mutants-${CI_NODE_INDEX}.log
        exit 0
      fi
    - cargo binstall --no-confirm --locked cargo-mutants cargo-nextest
    - |
      # Tonight's slice, cut CI_NODE_TOTAL ways, addressed as one shard of the
      # whole rotation: slice 3 node 5 of 24 is shard 3*24+4 out of 24*24.
      # cargo-mutants shards are 0-based while CI_NODE_INDEX is 1-based, and an
      # off-by-one silently drops part of the codebase instead of erroring, so
      # the conversion happens once, here, and nowhere else.
      SHARD=$(( NIGHTLY_SLICE * CI_NODE_TOTAL + CI_NODE_INDEX - 1 ))
      SHARD_TOTAL=$(( NIGHTLY_SLICES * CI_NODE_TOTAL ))
      # --test-tool nextest matches the per-MR shards; the unsharded nightly
      # omitted it and paid for the slower runner on every mutant.
      NEXTEST_PROFILE=mutation BARAD_DUR_TEST_REPO=${CI_PROJECT_DIR} cargo mutants \
        --shard ${SHARD}/${SHARD_TOTAL} \
        --test-tool nextest \
        --timeout-multiplier 3 --jobs 4 \
        --output mutants-out-${CI_NODE_INDEX} \
        2>&1 | tee mutants-${CI_NODE_INDEX}.log || true
  artifacts:
    paths:
      - mutants-${CI_NODE_INDEX}.log
      - mutants-out-${CI_NODE_INDEX}/
    when: always
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true

# Gate: aggregates every shard log into one whole-codebase kill rate, then
# records the commit so tomorrow's guard can skip an unchanged main. The SHA is
# written only after the gate passes, so a broken or timed-out night is retried
# rather than skipped.
mutation-nightly-gate:
  stage: analysis
  image: python:3.12-slim
  <<: *mutation-state-cache
  needs:
    - job: mutation-nightly
      artifacts: true
    # For the dotenv: NIGHTLY_SLICE only reaches jobs that name its producer.
    - job: mutation-nightly-guard
      artifacts: true
  script:
    - python3 scripts/mutation_gate.py 'mutants-*.log'
    - mkdir -p .mutation-nightly
    - echo "$CI_COMMIT_SHA" > .mutation-nightly/last-sha
    # The slice is recorded alongside the SHA: the guard skips only when both
    # match, so an unchanged main still gets tomorrow's slice swept.
    - echo "$NIGHTLY_SLICE" > .mutation-nightly/last-slice
    - echo "recorded slice $NIGHTLY_SLICE of $CI_COMMIT_SHA as the last completed nightly"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true  # Remove once a full-codebase baseline is confirmed

self-analysis:
  stage: analysis
  <<: *rust-base-merged
  needs:
    - build
  cache:
    - key: rust-registry
      policy: pull
      paths:
        - .cargo/registry/cache
        - .cargo/registry/index
        - .cargo/git/db
    - key: barad-dur-analysis
      paths:
        - .repository-analysis/blame_cache.bin
        - .repository-analysis/trends.json
  script:
    - ./target/release/barad-dur analyze . -v
    - ./target/release/barad-dur analyze . --json --pretty > barad-dur-report.json
    - ./target/release/barad-dur analyze . --html -o barad-dur-report.html
  artifacts:
    paths:
      - barad-dur-report.json
      - barad-dur-report.html
    expire_in: 1 month

# ── Field test (review gate P2) ───────────────
# Regression + determinism sweep over the publicly cloneable corpus subset
# (entries with a `url` in field-test/corpus.toml; see docs/review-process.md).
# The private entries only run in the maintainer's local `make field-test`.
# Any decision-surface diff fails the job and blocks the merge: baselines
# are accepted in a reviewed commit (`make field-test-accept`), never here.
# Clones are full (blame ages feed the surface). The cache is restored before
# checkout, so the script selects a directory using the merged manifest hash.
field-test:
  stage: analysis
  image: rust:1.98.1
  before_script:
    - *checkout-merge-result
  needs:
    - build
  # First MR run measured 51 min on the shared runners (8 repos, two
  # passes each, mautic alone ~30 min) against 8 min locally.
  timeout: 2 hours
  variables:
    BARAD_DUR_CORPUS_SCOPE: public
  cache:
    key: field-corpus
    paths:
      - .corpus/
    policy: pull-push
  script:
    - manifest_hash="$(sha256sum field-test/corpus.toml | cut -d ' ' -f 1)"
    - export BARAD_DUR_CORPUS_ROOT="$CI_PROJECT_DIR/.corpus/$manifest_hash"
    - ./target/release/field-test run
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

# Click through every tab of the generated report in jsdom — catches
# template JS that throws at runtime, which the Rust renderer's string
# assertions cannot see (safeRender would swallow it in the browser too).
report-smoke:
  stage: analysis
  image: node:22
  needs:
    - self-analysis
  script:
    # Pinned to the dashboard's major — a jsdom major bump can change the
    # VirtualConsole/jsdomError API this harness depends on.
    - npm install --no-save --no-audit --no-fund jsdom@29
    - node scripts/report-smoke.mjs barad-dur-report.html

# ── Deploy ───────────────────────────────────

pages:
  stage: deploy
  needs:
    - self-analysis
    - build-presentation
  script:
    - mkdir -p public/presentation
    - cp site/index.html public/index.html
    - cp barad-dur-report.html public/report.html
    - cp barad-dur-report.json public/report.json
    - cp -r docs/presentation/slidev/dist/. public/presentation/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Security ──────────────────────────────────

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: secret-detection

# ── Release ───────────────────────────────────

release-linux:
  stage: release
  image: rust:1.98.1-alpine
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  cache:
    key: release-linux-${CI_COMMIT_TAG}
    paths:
      - .cargo/registry
      - .cargo/git
      - target/
  before_script:
    - apk add --no-cache musl-dev openssl-dev openssl-libs-static pkgconf cmake make perl git
  script:
    - OPENSSL_STATIC=1 cargo build --release --target x86_64-unknown-linux-musl
    - mkdir -p dist
    - cp target/x86_64-unknown-linux-musl/release/barad-dur dist/barad-dur-linux-x86_64
  artifacts:
    paths:
      - dist/barad-dur-linux-x86_64
    expire_in: never

release-windows:
  stage: release
  image: rust:1.98.1
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  cache:
    key: release-windows-${CI_COMMIT_TAG}
    paths:
      - .cargo/registry
      - .cargo/git
      - target/
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake pkg-config libssl-dev gcc-mingw-w64-x86-64
    - rustup target add x86_64-pc-windows-gnu
  script:
    - cargo build --release --target x86_64-pc-windows-gnu
    - mkdir -p dist
    - cp target/x86_64-pc-windows-gnu/release/barad-dur.exe dist/barad-dur-windows-x86_64.exe
  artifacts:
    paths:
      - dist/barad-dur-windows-x86_64.exe
    expire_in: never

binary-smoke-test:
  stage: release
  image: alpine:3.21
  needs:
    - job: release-linux
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - chmod +x dist/barad-dur-linux-x86_64
    - dist/barad-dur-linux-x86_64 --version
    - dist/barad-dur-linux-x86_64 --help

release-publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs:
    - job: release-linux
      artifacts: true
    - job: release-windows
      artifacts: true
    - job: binary-smoke-test
  variables:
    PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/barad-dur"
  before_script:
    - apk add --no-cache curl
  script:
    # Upload binaries to the GitLab Generic Package Registry
    - |
      for file in dist/*; do
        FILENAME=$(basename "$file")
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "$file" \
             "${PACKAGE_REGISTRY_URL}/${CI_COMMIT_TAG}/${FILENAME}"
      done
    # Delete existing release if present so release-cli can recreate it cleanly
    - |
      curl -s --request DELETE \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}" || true
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: barad-dur-linux-x86_64
          url: "${PACKAGE_REGISTRY_URL}/${CI_COMMIT_TAG}/barad-dur-linux-x86_64"
        - name: barad-dur-windows-x86_64.exe
          url: "${PACKAGE_REGISTRY_URL}/${CI_COMMIT_TAG}/barad-dur-windows-x86_64.exe"

publish-crate:
  stage: release
  image: rust:1.98.1
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs:
    - binary-smoke-test
  variables:
    CARGO_HOME: /root/.cargo
  cache: []
  before_script: []
  script:
    - cargo login "$CARGO_REGISTRY_TOKEN"
    - |
      if ! cargo publish --allow-dirty 2>&1 | tee /tmp/publish.out; then
        grep -q "already exists" /tmp/publish.out && echo "Already published — skipping." || exit 1
      fi

# ── Docker ───────────────────────────────────

docker:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    IMAGE_TAG: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}
    IMAGE_TAG_LATEST: ${CI_REGISTRY_IMAGE}:latest
    COSIGN_VERSION: "v3.0.6"
  before_script:
    - |
      echo "Waiting for Docker daemon..."
      timeout 300 sh -c 'until docker info > /dev/null 2>&1; do sleep 2; done' \
        || { echo "ERROR: Docker daemon did not start within 300s"; exit 1; }
      echo "Docker daemon ready."
    - echo "${CI_REGISTRY_PASSWORD}" | docker login -u ${CI_REGISTRY_USER} --password-stdin ${CI_REGISTRY}
    - apk add --no-cache curl
    - curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
        -o /usr/local/bin/cosign
    - chmod +x /usr/local/bin/cosign
  script:
    - docker build -t ${IMAGE_TAG} .
    - docker push ${IMAGE_TAG}
    # Sign by digest — immutable, covers every tag pointing at this image
    - DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${IMAGE_TAG})
    - |
      printf '%s' "${COSIGN_PRIVATE_KEY}" | base64 -d > /tmp/cosign.key
      cosign sign --key /tmp/cosign.key --yes "${DIGEST}" || echo "WARNING: image signing failed - check COSIGN_PRIVATE_KEY CI variable"
      rm -f /tmp/cosign.key
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
        docker tag ${IMAGE_TAG} ${IMAGE_TAG_LATEST}
        docker push ${IMAGE_TAG_LATEST}
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag ${IMAGE_TAG} ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}
        docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  # The dind daemon intermittently fails to appear, and the wait above ends
  # in `exit 1` — a script_failure, which the `default:` retry deliberately
  # excludes so real build failures are not retried. A fresh service on
  # retry is what actually clears it, so this job opts in for itself.
  #
  # The cost is bounded and time-only: a genuinely broken Dockerfile builds
  # three times (~8 min each) before reporting. Every step here is
  # idempotent — build and push overwrite the same tags — except `cosign
  # sign`, which appends, so a retry after a successful sign leaves a second
  # signature on the same digest. Verification is unaffected.
  #
  # This masks an unhealthy runner rather than fixing one. Repeated retries
  # in the job log are the signal to look at the runner, not to raise `max`.
  # A job-level `retry:` REPLACES `default:retry` rather than merging with
  # it, so the default's two reasons must be repeated here or this job
  # would lose them.
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stale_schedule

trivy-scan:
  stage: docker
  # Pinned (was :latest) after an image update made `trivy` the container
  # entrypoint, swallowing GitLab's shell wrapper ("unknown command sh").
  image:
    name: aquasec/trivy:0.72.0
    entrypoint: [""]
  needs:
    - docker
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_AUTH_URL: $CI_REGISTRY
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - trivy image --exit-code 1 --severity CRITICAL ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}
  allow_failure: true

# ── Mirror ──────────────────────────────────

github-sync:
  stage: mirror
  image: alpine:3.21
  before_script:
    - apk add --no-cache git openssh-client
    - eval $(ssh-agent -s)
    - echo "$GITHUB_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H github.com >> ~/.ssh/known_hosts
  script:
    - git remote add github git@github.com:edouard-mangel/Barad-Dur.git 2>/dev/null || true
    # Two merges landing close together run their sync jobs out of order;
    # a rejected push is fine when the mirror already contains this commit.
    - |
      if ! git push github HEAD:main; then
        git fetch github main
        if git merge-base --is-ancestor HEAD FETCH_HEAD; then
          echo "Mirror already ahead (contains $CI_COMMIT_SHA) — nothing to sync"
        else
          echo "Mirror diverged from $CI_COMMIT_SHA" && exit 1
        fi
      fi
    # Push only this pipeline's tag. `--tags` pushes every tag in the repo,
    # so any tag the mirror already carries is rejected and fails the job
    # even when this release synced perfectly.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        if ! git push github "refs/tags/$CI_COMMIT_TAG"; then
          remote=$(git ls-remote github "refs/tags/$CI_COMMIT_TAG^{}" | cut -f1)
          local=$(git rev-parse "$CI_COMMIT_TAG^{}")
          if [ "$remote" = "$local" ]; then
            echo "Tag $CI_COMMIT_TAG already mirrored at $local — nothing to sync"
          else
            echo "Tag $CI_COMMIT_TAG on mirror is $remote, expected $local" && exit 1
          fi
        fi
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "trigger"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ── API (Pipeline Trigger) ──────────────────

analyze-api:
  stage: api
  image: ${CI_REGISTRY_IMAGE}:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" && $REPO_URL
  variables:
    REPO_BRANCH: "main"
    GIT_STRATEGY: none
  script:
    - set -euo pipefail
    # ── Input validation ──
    - |
      if [ -z "${REPO_URL:-}" ]; then
        echo "ERROR: REPO_URL is required"
        exit 1
      fi
    - |
      if ! echo "$REPO_URL" | grep -qE '^https://'; then
        echo "ERROR: REPO_URL must start with https://"
        exit 1
      fi
    - |
      if [ -n "${MIN_SCORE:-}" ] && ! echo "$MIN_SCORE" | grep -qE '^[0-9]+$'; then
        echo "ERROR: MIN_SCORE must be a positive integer (got: '${MIN_SCORE}')"
        exit 1
      fi
    # ── Clone target repository ──
    - |
      echo "Cloning ${REPO_URL} (branch: ${REPO_BRANCH})..."
      if ! git clone --branch "${REPO_BRANCH}" --depth 0 "${REPO_URL}" /tmp/target 2>&1; then
        echo "ERROR: Failed to clone repository"
        exit 1
      fi
    # ── Build CLI flags ──
    - |
      CATEGORY_FLAGS=""
      if [ -n "${CATEGORIES:-}" ]; then
        for cat in $(echo "$CATEGORIES" | tr ',' ' ' | tr '[:upper:]' '[:lower:]'); do
          case "$cat" in
            health|team|evolution|hygiene) CATEGORY_FLAGS="$CATEGORY_FLAGS --$cat" ;;
            *) echo "WARNING: Unknown category '$cat', skipping" ;;
          esac
        done
      fi
    # ── Validate ANALYSIS_OPTIONS (shell injection guard) ──
    - |
      if [ -n "${ANALYSIS_OPTIONS:-}" ]; then
        if echo "${ANALYSIS_OPTIONS}" | grep -qE '[;&|`$()<>\\]'; then
          echo "ERROR: ANALYSIS_OPTIONS contains forbidden shell metacharacters"
          exit 1
        fi
      fi
    # ── Run analysis (HTML report) ──
    - |
      echo "Running barad-dur analysis..."
      barad-dur analyze /tmp/target --html -o barad-dur-report.html ${CATEGORY_FLAGS} ${ANALYSIS_OPTIONS:-}
    # ── Optional quality gate ──
    - |
      if [ -n "${MIN_SCORE:-}" ]; then
        echo "Running quality gate (threshold: ${MIN_SCORE})..."
        if barad-dur gate /tmp/target --min-score "${MIN_SCORE}" ${CATEGORY_FLAGS}; then
          echo "PASS: quality gate passed"
        else
          echo "FAIL: quality gate failed (score < ${MIN_SCORE})"
          exit 1
        fi
      fi
  artifacts:
    paths:
      - barad-dur-report.html
    expire_in: 1 week
    when: always
  timeout: 30 minutes
