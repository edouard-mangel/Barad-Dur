workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "trigger"

stages:
  - lint
  - build
  - test
  - analysis
  - secret-detection
  - deploy
  - release
  - docker
  - api

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  SECRET_DETECTION_ENABLED: 'true'
  GIT_DEPTH: "0"

# Froggit's shared runners intermittently fail with Docker bridge networking
# errors ("bridge port not forwarding") — retry infrastructure-level failures
# automatically instead of failing the pipeline on them.
default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# Code cache — only registry index + git checkouts. The target/ dir is too large
# (30k+ files) and stalls Froggit's shared runners on upload. Instead, each job
# recompiles from source (~2 min) which is faster than downloading a stale cache.
.rust-cache: &rust-cache
  cache:
    key: rust-registry
    policy: pull
    paths:
      - .cargo/registry/cache
      - .cargo/registry/index
      - .cargo/git/db

# Shared base for Rust jobs that don't use CI tools
.rust-base: &rust-base
  image: rust:1.94
  <<: *rust-cache
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake pkg-config libssl-dev

# Shared base for Rust jobs that use CI tools (nextest, tarpaulin, etc.)
# cargo-binstall downloads pre-built binaries in seconds — no source compilation,
# no shared tool cache to manage. Each job installs only what it needs.
.rust-tools-base: &rust-tools-base
  image: rust:1.94
  <<: *rust-cache
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake pkg-config libssl-dev
    - curl -L --proto '=https' --tlsv1.2 -sSf
        "https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-musl.tgz"
        | tar -xz -C /usr/local/bin

# ── Lint ──────────────────────────────────────

fmt-check:
  stage: lint
  image: rust:1.94
  cache: []
  before_script: []
  script:
    - rustup component add rustfmt
    - cargo fmt -- --check

# ── Build ─────────────────────────────────────

# Clippy and release build share one runner: clippy (debug) runs first,
# then the release build reuses the already-compiled dependency artifacts.
build:
  stage: build
  <<: *rust-base
  cache:
    key: rust-registry
    policy: pull-push
    paths:
      - .cargo/registry/cache
      - .cargo/registry/index
      - .cargo/git/db
  script:
    - rustup component add clippy
    - cargo clippy --all-targets -- -D warnings
    - cargo build --release
  artifacts:
    paths:
      - target/release/barad-dur
    expire_in: 1 week

# ── Test ──────────────────────────────────────

test:
  stage: test
  <<: *rust-tools-base
  timeout: 3 hours
  script:
    - cargo binstall --no-confirm cargo-nextest
    - cargo nextest run --workspace --profile ci
  artifacts:
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 1 week

coverage:
  stage: test
  <<: *rust-tools-base
  timeout: 3 hours
  script:
    - cargo binstall --no-confirm cargo-tarpaulin
    - rustup component add llvm-tools-preview
    - cargo tarpaulin --engine llvm --out xml --output-dir coverage/ --fail-under 80
  coverage: '/^\d+.\d+% coverage/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

sast:
  stage: test

# ── Analysis ──────────────────────────────────

audit:
  stage: analysis
  <<: *rust-tools-base
  script:
    - cargo binstall --no-confirm cargo-audit
    - cargo audit
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      allow_failure: false
    - when: always
      allow_failure: true

deny:
  stage: analysis
  <<: *rust-tools-base
  script:
    - cargo binstall --no-confirm cargo-deny
    - cargo deny check
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      allow_failure: false
    - when: always
      allow_failure: true

semver-check:
  stage: analysis
  <<: *rust-tools-base
  script:
    - cargo binstall --no-confirm cargo-semver-checks
    - |
      # Diff against the previous git tag (works even before crates.io has the new version).
      # On tag pipelines, exclude the current tag to get the prior release.
      BASELINE=$(git tag --sort=-version:refname \
        | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
        | grep -v "^${CI_COMMIT_TAG}$" \
        | head -n 1)
      if [ -z "$BASELINE" ]; then
        echo "No previous tag found — skipping semver check"
        exit 0
      fi
      echo "Checking semver compatibility against $BASELINE"
      cargo semver-checks check-release --baseline-rev "$BASELINE"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      allow_failure: false
    - when: always
      allow_failure: true

# Mutation testing — per-feature: scoped to the MR diff or last commit on main.
# Split into 3 parallel shards + an aggregating gate. Blocking (allow_failure: false on gate).
# Each shard runs ~1/3 of the mutant list concurrently; nextest speeds up each test invocation.
.mutation-shard: &mutation-shard
  stage: analysis
  <<: *rust-tools-base
  timeout: 2 hours
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        git diff "$CI_MERGE_REQUEST_DIFF_BASE_SHA"..HEAD > recent.diff
      else
        git diff HEAD~1..HEAD > recent.diff
      fi
      if [ ! -s recent.diff ]; then
        echo "skipping mutation run" > mutants-${SHARD_INDEX}.log
        exit 0
      fi
      cargo binstall --no-confirm cargo-mutants cargo-nextest
      # --in-diff: only mutate code touched by the feature diff (per-feature strategy).
      # --timeout-multiplier instead of a fixed cap: the suite's clean runtime grows
      # with the codebase and already outran a hardcoded 300s once (baseline timeout).
      # || true: shard exit codes (missed/timeout mutants) must not fail the job —
      # the mutation-gate aggregates all shards and is the single blocking decision.
      BARAD_DUR_TEST_REPO=${CI_PROJECT_DIR} cargo mutants \
        --in-diff recent.diff \
        --shard ${SHARD_INDEX}/3 \
        --test-tool nextest \
        --timeout-multiplier 3 --jobs 2 \
        --output mutants-out-${SHARD_INDEX} \
        2>&1 | tee mutants-${SHARD_INDEX}.log || true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
  allow_failure: false

mutation-0:
  <<: *mutation-shard
  variables:
    SHARD_INDEX: "0"
  artifacts:
    paths:
      - mutants-0.log
      - mutants-out-0/
    when: always
    expire_in: 1 week

mutation-1:
  <<: *mutation-shard
  variables:
    SHARD_INDEX: "1"
  artifacts:
    paths:
      - mutants-1.log
      - mutants-out-1/
    when: always
    expire_in: 1 week

mutation-2:
  <<: *mutation-shard
  variables:
    SHARD_INDEX: "2"
  artifacts:
    paths:
      - mutants-2.log
      - mutants-out-2/
    when: always
    expire_in: 1 week

# Gate: aggregates all shard logs and enforces the ≥80% kill rate.
mutation-gate:
  stage: analysis
  image: python:3.12-slim
  needs:
    - job: mutation-0
      artifacts: true
    - job: mutation-1
      artifacts: true
    - job: mutation-2
      artifacts: true
  script:
    - |
      python3 << 'PYEOF'
      import re, sys, os
      total_caught = total_missed = total_timeout = total_unviable = total_tested = 0
      all_skipped = True
      for i in range(3):
          path = f'mutants-{i}.log'
          if not os.path.exists(path):
              continue
          content = open(path).read()
          if 'skipping mutation run' in content:
              continue
          if 'ERROR cargo test failed' in content:
              print(f'Shard {i}: baseline tests failed — cannot compute kill rate')
              sys.exit(1)
          all_skipped = False
          m = re.search(r'(\d+) mutants? tested', content)
          if not m:
              # cargo-mutants prints only an INFO line (no summary) when the
              # diff touches no Rust source — a docs/CI-only push is a skip,
              # not a failure.
              if re.search(r'Found 0 mutants|[Nn]o mutants found|Diff changes no Rust source files', content):
                  continue
              # Shards swallow cargo-mutants exit codes (|| true), so a log with
              # no summary means the run itself broke — surface that here.
              print(f'Shard {i}: no mutants summary in log — shard run failed')
              sys.exit(1)
          tested = int(m.group(1))
          # cargo-mutants omits zero categories from the summary line, so parse
          # each one independently within that line and default to 0.
          summary = content[m.start():].splitlines()[0]
          def count(pattern):
              c = re.search(r'(\d+) ' + pattern, summary)
              return int(c.group(1)) if c else 0
          caught, missed = count('caught'), count('missed')
          timeout_n, unviable = count('timeouts?'), count('unviable')
          total_tested += tested
          total_caught += caught
          total_missed += missed
          total_timeout += timeout_n
          total_unviable += unviable
      if all_skipped:
          print('All shards skipped — no source changes')
          sys.exit(0)
      viable = total_tested - total_unviable
      if viable == 0:
          print('No viable mutants — skipping gate')
          sys.exit(0)
      # TIMEOUTs count as caught: a mutant that pushes the suite past 3x its
      # baseline runtime is exercised by tests and cannot ship undetected —
      # it just fails slowly.
      effective_caught = total_caught + total_timeout
      rate = effective_caught / viable * 100
      print(f'Kill rate: {effective_caught}/{viable} viable = {rate:.1f}% ({total_caught} fast + {total_timeout} timeout, {total_missed} missed)')
      if rate < 80:
          print(f'FAIL: {rate:.1f}% < 80% required. Add tests for {total_missed} missed mutant(s).')
          sys.exit(1)
      print(f'PASS: {rate:.1f}% >= 80%')
      PYEOF
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
  allow_failure: false

# Mutation testing — nightly: full codebase, no diff filter.
# To enable: Settings > CI/CD > Schedules — add a daily trigger on main.
# Set allow_failure: false once full-codebase kill rate ≥ 80% is confirmed.
mutation-nightly:
  stage: analysis
  <<: *rust-tools-base
  timeout: 6 hours
  script:
    - cargo binstall --no-confirm cargo-mutants
    - BARAD_DUR_TEST_REPO=${CI_PROJECT_DIR} cargo mutants --timeout-multiplier 3 --jobs 4 2>&1 | tee mutants.log || true
    - |
      python3 << 'PYEOF'
      import re, sys
      with open('mutants.log') as f:
          content = f.read()
      m = re.search(r'(\d+) mutants? tested', content)
      if not m:
          print('No mutants generated — skipping kill rate gate')
          sys.exit(0)
      total = int(m.group(1))
      # cargo-mutants omits zero categories from the summary line, so parse
      # each one independently within that line and default to 0.
      summary = content[m.start():].splitlines()[0]
      def count(pattern):
          c = re.search(r'(\d+) ' + pattern, summary)
          return int(c.group(1)) if c else 0
      caught, missed = count('caught'), count('missed')
      timeout_n, unviable = count('timeouts?'), count('unviable')
      viable = total - unviable
      if viable == 0:
          print('No viable mutants — skipping gate')
          sys.exit(0)
      effective_caught = caught + timeout_n
      rate = effective_caught / viable * 100
      print(f'Kill rate: {effective_caught}/{viable} viable mutants = {rate:.1f}% ({caught} fast + {timeout_n} timeout)')
      if rate < 80:
          print(f'FAIL: {rate:.1f}% < 80% required. Add tests for {missed} missed mutant(s).')
          sys.exit(1)
      print(f'PASS: {rate:.1f}% >= 80%')
      PYEOF
  artifacts:
    paths:
      - mutants.out/
    when: always
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true  # Remove once full-codebase baseline ≥ 80% is confirmed

self-analysis:
  stage: analysis
  <<: *rust-base
  needs:
    - build
  cache:
    - key: rust-registry
      policy: pull
      paths:
        - .cargo/registry/cache
        - .cargo/registry/index
        - .cargo/git/db
    - key: barad-dur-analysis
      paths:
        - .repository-analysis/blame_cache.bin
        - .repository-analysis/trends.json
  script:
    - ./target/release/barad-dur analyze . -v
    - ./target/release/barad-dur analyze . --json --pretty > barad-dur-report.json
    - ./target/release/barad-dur analyze . --html -o barad-dur-report.html
  artifacts:
    paths:
      - barad-dur-report.json
      - barad-dur-report.html
    expire_in: 1 month

# ── Deploy ───────────────────────────────────

pages:
  stage: deploy
  needs:
    - self-analysis
  script:
    - mkdir -p public
    - cp site/index.html public/index.html
    - cp barad-dur-report.html public/report.html
    - cp barad-dur-report.json public/report.json
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Security ──────────────────────────────────

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: secret-detection

# ── Release ───────────────────────────────────

release-linux:
  stage: release
  image: rust:1.94-alpine
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  cache:
    key: release-linux-${CI_COMMIT_TAG}
    paths:
      - .cargo/registry
      - .cargo/git
      - target/
  before_script:
    - apk add --no-cache musl-dev openssl-dev openssl-libs-static pkgconf cmake make perl git
  script:
    - OPENSSL_STATIC=1 cargo build --release --target x86_64-unknown-linux-musl
    - mkdir -p dist
    - cp target/x86_64-unknown-linux-musl/release/barad-dur dist/barad-dur-linux-x86_64
  artifacts:
    paths:
      - dist/barad-dur-linux-x86_64
    expire_in: never

release-windows:
  stage: release
  image: rust:1.94
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  cache:
    key: release-windows-${CI_COMMIT_TAG}
    paths:
      - .cargo/registry
      - .cargo/git
      - target/
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake pkg-config libssl-dev gcc-mingw-w64-x86-64
    - rustup target add x86_64-pc-windows-gnu
  script:
    - cargo build --release --target x86_64-pc-windows-gnu
    - mkdir -p dist
    - cp target/x86_64-pc-windows-gnu/release/barad-dur.exe dist/barad-dur-windows-x86_64.exe
  artifacts:
    paths:
      - dist/barad-dur-windows-x86_64.exe
    expire_in: never

binary-smoke-test:
  stage: release
  image: alpine:3.21
  needs:
    - job: release-linux
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - chmod +x dist/barad-dur-linux-x86_64
    - dist/barad-dur-linux-x86_64 --version
    - dist/barad-dur-linux-x86_64 --help

release-publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs:
    - job: release-linux
      artifacts: true
    - job: release-windows
      artifacts: true
    - job: binary-smoke-test
  variables:
    PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/barad-dur"
  before_script:
    - apk add --no-cache curl
  script:
    # Upload binaries to the GitLab Generic Package Registry
    - |
      for file in dist/*; do
        FILENAME=$(basename "$file")
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "$file" \
             "${PACKAGE_REGISTRY_URL}/${CI_COMMIT_TAG}/${FILENAME}"
      done
    # Delete existing release if present so release-cli can recreate it cleanly
    - |
      curl -s --request DELETE \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}" || true
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: barad-dur-linux-x86_64
          url: "${PACKAGE_REGISTRY_URL}/${CI_COMMIT_TAG}/barad-dur-linux-x86_64"
        - name: barad-dur-windows-x86_64.exe
          url: "${PACKAGE_REGISTRY_URL}/${CI_COMMIT_TAG}/barad-dur-windows-x86_64.exe"

publish-crate:
  stage: release
  image: rust:1.94
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs:
    - binary-smoke-test
  variables:
    CARGO_HOME: /root/.cargo
  cache: []
  before_script: []
  script:
    - cargo login "$CARGO_REGISTRY_TOKEN"
    - |
      if ! cargo publish --allow-dirty 2>&1 | tee /tmp/publish.out; then
        grep -q "already exists" /tmp/publish.out && echo "Already published — skipping." || exit 1
      fi

# ── Docker ───────────────────────────────────

docker:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    IMAGE_TAG: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}
    IMAGE_TAG_LATEST: ${CI_REGISTRY_IMAGE}:latest
    COSIGN_VERSION: "v3.0.6"
  before_script:
    - |
      echo "Waiting for Docker daemon..."
      until docker info > /dev/null 2>&1; do sleep 1; done
      echo "Docker daemon ready."
    - echo "${CI_REGISTRY_PASSWORD}" | docker login -u ${CI_REGISTRY_USER} --password-stdin ${CI_REGISTRY}
    - apk add --no-cache curl
    - curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
        -o /usr/local/bin/cosign
    - chmod +x /usr/local/bin/cosign
  script:
    - docker build -t ${IMAGE_TAG} .
    - docker push ${IMAGE_TAG}
    # Sign by digest — immutable, covers every tag pointing at this image
    - DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${IMAGE_TAG})
    - |
      printf '%s' "${COSIGN_PRIVATE_KEY}" | base64 -d > /tmp/cosign.key
      cosign sign --key /tmp/cosign.key --yes "${DIGEST}" || echo "WARNING: image signing failed - check COSIGN_PRIVATE_KEY CI variable"
      rm -f /tmp/cosign.key
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
        docker tag ${IMAGE_TAG} ${IMAGE_TAG_LATEST}
        docker push ${IMAGE_TAG_LATEST}
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag ${IMAGE_TAG} ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}
        docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ── API (Pipeline Trigger) ──────────────────

analyze-api:
  stage: api
  image: ${CI_REGISTRY_IMAGE}:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" && $REPO_URL
  variables:
    REPO_BRANCH: "main"
    GIT_STRATEGY: none
  script:
    - set -euo pipefail
    # ── Input validation ──
    - |
      if [ -z "${REPO_URL:-}" ]; then
        echo "ERROR: REPO_URL is required"
        exit 1
      fi
    - |
      if ! echo "$REPO_URL" | grep -qE '^https://'; then
        echo "ERROR: REPO_URL must start with https://"
        exit 1
      fi
    - |
      if [ -n "${MIN_SCORE:-}" ] && ! echo "$MIN_SCORE" | grep -qE '^[0-9]+$'; then
        echo "ERROR: MIN_SCORE must be a positive integer (got: '${MIN_SCORE}')"
        exit 1
      fi
    # ── Clone target repository ──
    - |
      echo "Cloning ${REPO_URL} (branch: ${REPO_BRANCH})..."
      if ! git clone --branch "${REPO_BRANCH}" --depth 0 "${REPO_URL}" /tmp/target 2>&1; then
        echo "ERROR: Failed to clone repository"
        exit 1
      fi
    # ── Build CLI flags ──
    - |
      CATEGORY_FLAGS=""
      if [ -n "${CATEGORIES:-}" ]; then
        for cat in $(echo "$CATEGORIES" | tr ',' ' ' | tr '[:upper:]' '[:lower:]'); do
          case "$cat" in
            health|team|evolution|hygiene) CATEGORY_FLAGS="$CATEGORY_FLAGS --$cat" ;;
            *) echo "WARNING: Unknown category '$cat', skipping" ;;
          esac
        done
      fi
    # ── Run analysis (HTML report) ──
    - |
      echo "Running barad-dur analysis..."
      barad-dur analyze /tmp/target --html -o barad-dur-report.html ${CATEGORY_FLAGS}
    # ── Optional quality gate ──
    - |
      if [ -n "${MIN_SCORE:-}" ]; then
        echo "Running quality gate (threshold: ${MIN_SCORE})..."
        if barad-dur gate /tmp/target --min-score "${MIN_SCORE}" ${CATEGORY_FLAGS}; then
          echo "PASS: quality gate passed"
        else
          echo "FAIL: quality gate failed (score < ${MIN_SCORE})"
          exit 1
        fi
      fi
  artifacts:
    paths:
      - barad-dur-report.html
    expire_in: 1 week
    when: always
  timeout: 30 minutes
