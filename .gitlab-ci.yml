stages:
  - lint
  - build
  - test
  - analysis
  - secret-detection
  - deploy
  - release
  - docker

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  SECRET_DETECTION_ENABLED: 'true'
  GIT_DEPTH: "0"

# Cache Rust dependencies between jobs
.rust-cache: &rust-cache
  cache:
    key: rust-${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/registry
      - .cargo/git
      - target/

# Shared base for Rust jobs
.rust-base: &rust-base
  image: rust:1.94
  <<: *rust-cache
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake pkg-config libssl-dev

# ── Lint ──────────────────────────────────────

fmt-check:
  stage: lint
  <<: *rust-base
  script:
    - rustup component add rustfmt
    - cargo fmt -- --check

clippy:
  stage: lint
  <<: *rust-base
  script:
    - rustup component add clippy
    - cargo clippy --all-targets -- -D warnings

# ── Build ─────────────────────────────────────

build:
  stage: build
  <<: *rust-base
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/barad-dur
    expire_in: 1 week

# ── Test ──────────────────────────────────────

test:
  stage: test
  <<: *rust-base
  script:
    - cargo test --lib
    - cargo test --test collector_tests
    - cargo test --test integration_tests

coverage:
  stage: test
  <<: *rust-base
  script:
    - cargo install cargo-tarpaulin --locked
    - cargo tarpaulin --out xml --output-dir coverage/
  coverage: '/^\d+.\d+% coverage/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml
    expire_in: 1 week

sast:
  stage: test

# ── Analysis ──────────────────────────────────

audit:
  stage: analysis
  <<: *rust-base
  script:
    - cargo install cargo-audit --locked
    - cargo audit
  allow_failure: true

deny:
  stage: analysis
  <<: *rust-base
  script:
    - cargo install cargo-deny --locked
    - cargo deny check
  allow_failure: true

semver-check:
  stage: analysis
  <<: *rust-base
  script:
    - cargo install cargo-semver-checks --version 0.42.0 --locked
    - cargo semver-checks check-release
  allow_failure: true

# Mutation testing — runs on daily schedule only, and only when commits landed
# in the last 25 hours. Mutations are scoped to lines changed in that window.
# To enable: Settings > CI/CD > Schedules — add a daily trigger on main.
# Set allow_failure: false once the baseline is established and stable.
mutation:
  stage: analysis
  <<: *rust-base
  script:
    - cargo install cargo-mutants --locked
    - |
      # Skip if no commits landed in the last 25 hours
      SINCE=$(git log --since="25 hours ago" --format="%H" | tail -1)
      if [ -z "$SINCE" ]; then
        echo "No commits in the last 25 hours — skipping mutation run"
        exit 0
      fi
      # Diff from just before the oldest recent commit to HEAD
      BEFORE=$(git rev-parse "${SINCE}^" 2>/dev/null || echo "$SINCE")
      git diff "$BEFORE"..HEAD > recent.diff
      cargo mutants --in-diff recent.diff --timeout 60 2>&1 | tee mutants.log
    - |
      python3 << 'PYEOF'
      import re, sys
      with open('mutants.log') as f:
          content = f.read()
      if 'skipping mutation run' in content:
          sys.exit(0)
      m = re.search(r'(\d+) mutants tested.*?(\d+) caught.*?(\d+) missed.*?(\d+) timeout.*?(\d+) unviable', content)
      if not m:
          print('No mutants generated — skipping kill rate gate')
          sys.exit(0)
      total, caught, missed, timeout_n, unviable = map(int, m.groups())
      viable = total - unviable
      if viable == 0:
          print('No viable mutants — skipping gate')
          sys.exit(0)
      rate = caught / viable * 100
      print(f'Kill rate: {caught}/{viable} viable mutants = {rate:.1f}%')
      if rate < 80:
          print(f'FAIL: {rate:.1f}% < 80% required. Add tests for {missed} missed mutant(s).')
          sys.exit(1)
      print(f'PASS: {rate:.1f}% >= 80%')
      PYEOF
  artifacts:
    paths:
      - mutants.out/
    when: always
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true  # Remove once baseline is established

self-analysis:
  stage: analysis
  <<: *rust-base
  needs:
    - build
  cache:
    - key: rust-${CI_COMMIT_REF_SLUG}
      paths:
        - .cargo/registry
        - .cargo/git
        - target/
    - key: barad-dur-analysis
      paths:
        - .repository-analysis/blame_cache.bin
        - .repository-analysis/trends.json
  script:
    - ./target/release/barad-dur analyze . -v
    - ./target/release/barad-dur analyze . --json --pretty > barad-dur-report.json
    - ./target/release/barad-dur analyze . --html -o barad-dur-report.html
  artifacts:
    paths:
      - barad-dur-report.json
      - barad-dur-report.html
    expire_in: 1 month

# ── Deploy ───────────────────────────────────

pages:
  stage: deploy
  needs:
    - self-analysis
  script:
    - mkdir -p public
    - cp barad-dur-report.html public/index.html
    - cp barad-dur-report.json public/report.json
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Security ──────────────────────────────────

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: secret-detection

# ── Release ───────────────────────────────────

release:
  stage: release
  <<: *rust-base
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/barad-dur
    expire_in: never
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: barad-dur-linux-x86_64
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/target/release/barad-dur"

# ── Docker ───────────────────────────────────

docker:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}
    IMAGE_TAG_LATEST: ${CI_REGISTRY_IMAGE}:latest
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    - docker build -t ${IMAGE_TAG} .
    - docker push ${IMAGE_TAG}
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
        docker tag ${IMAGE_TAG} ${IMAGE_TAG_LATEST}
        docker push ${IMAGE_TAG_LATEST}
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag ${IMAGE_TAG} ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}
        docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
