[package]
name = "barad-dur"
# `cargo run` must pick the tool, not the feature-gated field-test driver.
default-run = "barad-dur"
version = "0.22.0"
edition = "2021"
description = "The all-seeing repository analyzer"
license = "GPL-3.0-only"
repository = "https://lab.frogg.it/Edouard_Mangel/barad-dur"
homepage = "https://lacrafterie.tech/barad-dur/"
documentation = "https://lab.frogg.it/Edouard_Mangel/barad-dur"
keywords = ["git", "analysis", "metrics", "health", "complexity"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
git2 = "0.21.0"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# bincode 3.0.0 contains only compile_error!; 2.0.1 is the latest usable release.
bincode = { version = "2.0.1", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
colored = "3.1.1"
rayon = "1.12.0"
indicatif = "0.18.6"
anyhow = "1.0.104"
glob-match = "0.2.1"
ignore = "0.4.33"
# Preserve the 0.12 native TLS backend and defaults; 0.13 defaults to rustls.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls-no-alpn", "charset", "http2", "system-proxy"] }
url = "2.5.8"
tempfile = "3.27.0"
toml = "1.1.6"
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-php = "0.24.2"
ts-rs = { version = "=12.0.1", optional = true, features = ["chrono-impl", "no-serde-warnings"] }

[features]
field-test = []
export-types = ["dep:ts-rs"]

[[bin]]
name = "field-test"
path = "src/bin/field-test.rs"
required-features = ["field-test"]

[[example]]
name = "export_report_types"
required-features = ["export-types"]

[[example]]
name = "export_report_fixture"
required-features = ["export-types"]

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.151"
