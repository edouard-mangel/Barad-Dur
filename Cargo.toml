[package]
name = "barad-dur"
version = "0.17.3"
edition = "2021"
description = "The all-seeing repository analyzer"
license = "GPL-3.0-only"
repository = "https://lab.frogg.it/Edouard_Mangel/barad-dur"
homepage = "https://lacrafterie.tech/barad-dur/"
documentation = "https://lab.frogg.it/Edouard_Mangel/barad-dur"
keywords = ["git", "analysis", "metrics", "health", "complexity"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
git2 = "0.20"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
chrono = { version = "0.4", features = ["serde"] }
colored = "2"
rayon = "1"
indicatif = "0.17"
anyhow = "1"
glob-match = "0.2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
url = "2"
tempfile = "3"
toml = "0.8"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-kotlin-ng = "1.1.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
