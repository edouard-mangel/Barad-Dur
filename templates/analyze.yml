# barad-dur analysis template
#
# Include this in any GitLab project to get automatic repository analysis:
#
#   include:
#     - project: Edouard_Mangel/barad-dur
#       ref: main
#       file: templates/analyze.yml
#
# The job runs on every push to the default branch and on every MR.
# Reports are uploaded as artifacts and browsable in the GitLab UI.
#
# The binary is downloaded from the barad-dur Generic Package Registry
# using CI_JOB_TOKEN (works across projects on the same GitLab instance).
#
# Optional variables (set in your project's CI/CD settings or job override):
#   BARAD_DUR_FLAGS:   extra flags passed to `barad-dur analyze`
#                      e.g. "--skip-blame" to speed up large repos
#   BARAD_DUR_VERSION: pin a specific release tag (default: latest)

barad-dur:
  stage: test
  image: alpine:3.21
  variables:
    GIT_DEPTH: "0"
    BARAD_DUR_FLAGS: ""
    BARAD_DUR_VERSION: ""
    BARAD_DUR_REGISTRY: "https://lab.frogg.it/api/v4/projects/Edouard_Mangel%2Fbarad-dur"
  before_script:
    - apk add --no-cache curl git
    - |
      if [ -z "$BARAD_DUR_VERSION" ]; then
        BARAD_DUR_VERSION=$(curl -sf --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${BARAD_DUR_REGISTRY}/releases/permalink/latest" \
          | grep -o '"tag_name":"[^"]*"' | cut -d'"' -f4)
      fi
    - echo "Downloading barad-dur ${BARAD_DUR_VERSION}"
    - |
      curl -fL --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${BARAD_DUR_REGISTRY}/packages/generic/barad-dur/${BARAD_DUR_VERSION}/barad-dur-linux-x86_64" \
        -o /usr/local/bin/barad-dur
    - chmod +x /usr/local/bin/barad-dur
    - barad-dur --version
  script:
    - barad-dur analyze . --html --json $BARAD_DUR_FLAGS
  artifacts:
    name: barad-dur-report
    paths:
      - barad-dur-report.html
      - barad-dur-report.json
    expose_as: "barad-dur report"
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
