[profile.ci]
junit = { path = "junit.xml" }

# cargo-mutants can time out its cargo process while nextest still waits for a
# looping test child. Bound those children inside the mutation runner itself.
[profile.mutation]
slow-timeout = { period = "60s", terminate-after = 3, grace-period = "1s" }

# The same bound also applies to the unmutated baseline. Integration tests
# analyse a real repository and run 110-180s on a loaded shard, so 180s killed
# a healthy baseline; they get 600s, still far below cargo-mutants' own timeout.
[[profile.mutation.overrides]]
filter = 'kind(test)'
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "1s" }
